<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Releases — Terper Club</title>
    <link rel="stylesheet" href="./css/terper.css">
</head>
<body>
<div class="wrapper">

    <header class="site-head">
        <a class="logo-link" href="./"><span class="logo">Terper</span></a>
        <nav class="nav-h">
            <a href="./art">Art</a>
            <a href="./live">Live</a>
            <a href="./releases" class="is-current" aria-current="page">Releases</a>
            <a href="./bio">Bio</a>
            <a href="./contact">Contact</a>
        </nav>
    </header>

    <div class="page-head">
        <h1 class="page-title">Releases</h1>
    </div>

    <div class="grid">

        <a class="tile" href="https://terper.bandcamp.com/album/scotopia" target="_blank" rel="noopener">
            <img src="./media/scotopia.jpg" alt="Scotopia cover art" loading="lazy">
            <span class="tile-cap">
                <span class="cap-name">Scotopia</span>
            </span>
        </a>

        <a class="tile" href="https://terper.bandcamp.com/album/xo-sphere" target="_blank" rel="noopener">
            <img src="./media/xo-sphere.jpg" alt="XO Sphere cover art" loading="lazy">
            <span class="tile-cap">
                <span class="cap-name">XO Sphere</span>
            </span>
        </a>

        <a class="tile" href="https://terper.bandcamp.com/album/velvet-seafloor" target="_blank" rel="noopener">
            <img src="./media/terper_balcon_2.jpg" alt="Velvet Seafloor cover art" loading="lazy">
            <span class="tile-cap">
                <span class="cap-name">Velvet Seafloor</span>
            </span>
        </a>

        <a class="tile" href="https://soundcloud.com/terperclub/sets/biofeedback-signals-monthly" target="_blank" rel="noopener">
            <img src="./media/sfr-1.jpg" alt="Shared Frequencies Radio residency" loading="lazy">
            <span class="tile-cap">
                <span class="cap-name">DJ Residency</span>
                <span class="cap-venue">Shared Frequencies Radio</span>
            </span>
        </a>

    </div>

    <footer class="site-foot">
        <nav class="foot-links">
            <a href="https://www.instagram.com/terper.club" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.youtube.com/@TERPERCLUB" target="_blank" rel="noopener">YouTube</a>
            <a href="https://terper.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
            <a href="https://soundcloud.com/terperclub" target="_blank" rel="noopener">SoundCloud</a>
        </nav>
        <p>&copy; 2026 Terper Club</p>
    </footer>

</div>

</html>
